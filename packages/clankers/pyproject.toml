[project]
name = "clankers"
version = "0.1.0"
description = "Core operations package: hand gateway, rerun viz, task runner, safety"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "websockets>=13",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Real hardware I/O. The gateway's bus layer imports lerobot lazily via
# clankers.hand_gateway.bus; unit tests run against the mock bus without these.
hardware = [
    "lerobot>=0.6",
    "dynamixel-sdk>=3.7",
    # lerobot's MotorsBus.__init__ require_package()s deepdiff but does not depend on it;
    # without it every real-bus construction dies at import time.
    "deepdiff>=8",
]
viz = [
    "rerun-sdk>=0.30,<0.31",
]
# Webcam teleop demo (clankers-teleop-demo). Retarget math itself is pure numpy;
# these are only needed for live camera tracking.
teleop = [
    # NOTE: clankers.teleop.camera is written against the legacy `mp.solutions.hands` API,
    # which NO mediapipe wheel available for Python 3.13 still ships -- 0.10.35's own
    # __init__ exposes only tasks/Image/ImageFormat, same as 1.x. Pinning does not recover
    # it; `clankers-teleop-demo` needs porting to the Tasks API (mp.tasks.vision.
    # HandLandmarker, which also needs a .task model asset). scripts/camera_preview.py
    # needs none of this and works today.
    "mediapipe>=0.10.14",
    # contrib rather than plain opencv-python because mediapipe depends on contrib, and
    # opencv-python / opencv-contrib-python / opencv-python-headless all install the same
    # `cv2` package and overwrite each other. lerobot still pulls headless transitively, so
    # if `import cv2` ever yields an empty namespace package, repair with:
    #   uv pip uninstall opencv-python opencv-python-headless opencv-contrib-python
    #   uv pip install --reinstall opencv-contrib-python
    "opencv-contrib-python>=4.10",
]

[project.scripts]
clankers-hand-gateway = "clankers.hand_gateway.server:main"
clankers-task-runner = "clankers.tasks.server:main"
clankers-export-config = "clankers.config.export:main"
clankers-teleop-demo = "clankers.teleop.demo:main"
clankers-detect = "clankers.detect:main"
clankers-build-urdf = "clankers.urdf.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clankers"]
