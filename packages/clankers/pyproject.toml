[project]
name = "clankers"
version = "0.1.0"
description = "Core operations package: hand gateway, rerun viz, task runner, safety"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "websockets>=13",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Real hardware I/O. The gateway's bus layer imports lerobot lazily via
# clankers.hand_gateway.bus; unit tests run against the mock bus without these.
hardware = [
    "lerobot>=0.6",
    "dynamixel-sdk>=3.7",
]
viz = [
    "rerun-sdk>=0.30,<0.31",
]

[project.scripts]
clankers-hand-gateway = "clankers.hand_gateway.server:main"
clankers-task-runner = "clankers.tasks.server:main"
clankers-export-config = "clankers.config.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clankers"]
