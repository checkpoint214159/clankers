[project]
name = "clankers"
version = "0.1.0"
description = "Core operations package: hand gateway, rerun viz, task runner, safety"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "websockets>=13",
    "numpy>=1.26",
]

[project.optional-dependencies]
# THE ROBOT CONTROLLER (ADR-0005): everything needed to own a serial bus and serve the WS
# gateway, and nothing else. This is what the Pi installs. No lerobot and therefore no
# torch/nvidia stack -- the brain that decides what to do lives on another machine and
# reaches the hardware over the WS envelope. `clankers.hand_gateway.sdk_bus.DynamixelBus`
# talks protocol 2.0 directly, so `hardware` is NOT needed to move the real hand.
controller = [
    "dynamixel-sdk>=3.7",
]
# The BRAIN's hardware path: lerobot's own bus/robot classes, used when brain and
# controller are the same machine (a laptop with the arm plugged in). Pulls torch --
# do not install this on the Pi. The gateway's bus layer imports lerobot lazily via
# clankers.hand_gateway.bus; unit tests run against the mock bus without these.
hardware = [
    "lerobot>=0.6",
    "dynamixel-sdk>=3.7",
    # lerobot's MotorsBus.__init__ require_package()s deepdiff but does not depend on it;
    # without it every real-bus construction dies at import time.
    "deepdiff>=8",
]
viz = [
    "rerun-sdk>=0.30,<0.31",
]
# Camera debugging on Linux/V4L2 (scripts/camera_debug.py). Deliberately separate from
# `teleop`: mediapipe publishes no aarch64 wheel, so `uv sync --extra teleop` fails to
# resolve outright on the Pi and would take the camera tooling down with it.
camera = [
    "opencv-contrib-python>=4.10",
]
# Webcam teleop demo (clankers-teleop-demo). Retarget math itself is pure numpy;
# these are only needed for live camera tracking.
teleop = [
    # NOT mediapipe. 1.0.1 is its only release with a linux-aarch64 wheel, and that binary
    # is built with the ARMv8 crypto extensions on, so it SIGILLs on the Pi's Cortex-A72
    # ("compiled with aes enabled, but this feature is not available on this processor").
    # clankers.teleop.landmarker runs mediapipe's own .tflite hand models on LiteRT
    # instead, which has no such requirement and resolves on every platform we care about.
    "ai-edge-litert>=1.0",
    # contrib rather than plain opencv-python because opencv-python /
    # opencv-contrib-python / opencv-python-headless all install the same `cv2` package and
    # overwrite each other. lerobot still pulls headless transitively, so if `import cv2`
    # ever yields an empty namespace package, repair with:
    #   uv pip uninstall opencv-python opencv-python-headless opencv-contrib-python
    #   uv pip install --reinstall opencv-contrib-python
    "opencv-contrib-python>=4.10",
]

[project.scripts]
clankers-hand-gateway = "clankers.hand_gateway.server:main"
clankers-task-runner = "clankers.tasks.server:main"
clankers-export-config = "clankers.config.export:main"
clankers-teleop-demo = "clankers.teleop.demo:main"
clankers-detect = "clankers.detect:main"
clankers-build-urdf = "clankers.urdf.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clankers"]
