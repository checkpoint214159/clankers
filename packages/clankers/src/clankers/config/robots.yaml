# Single source of truth for robot topology, IDs, limits, and gains.
# Consumed by: hand_gateway, lerobot_robot_clankers, viz, tasks, and (as generated
# JSON via `clankers-export-config`) the studio frontend.
#
# Units: radians, rad/s, Nm, mA, °C unless stated. Quaternions are (x, y, z, w).

schema_version: 1

ports:
  arm_gateway_ws: 9002 # motorbridge ws_gateway (existing, one process per bus)
  hand_gateway_ws: 9003 # clankers hand gateway
  task_runner_ws: 9010
  studio_dev: 18110

arm:
  name: rebot_b601_dm
  vendor: damiao
  transport: dm-serial # Mac: /dev/cu.usbmodem*; 921600 baud; gateway --dt-ms 20
  serial_baud: 921600
  lerobot:
    robot_type: rebot_b601_follower # upstream LeRobot ≥0.6; can_adapter=damiao (serial bridge)
    can_adapter: damiao
    # The stock config assumes 7 motors incl. gripper. Once the gripper is replaced by
    # the LEAP adapter, use a 6-joint config (drop joint 7). See ADR-0001 / plan step 6b.
    use_gripper: true # flip to false when the adapter is mounted
  # From motorbridge-studio src/lib/robotArm.js (rebot-arm-damiao profile, proven on hardware).
  # feedback_id (Master ID) convention: 0x10 + motor_id. Never set Master ID to 0x00.
  joints:
    - { joint: 1, name: joint1, motor_id: 0x01, feedback_id: 0x11, model: dm4340, limit: { min: -2.61, max: 2.61 }, gains: { ctrl_mode: 2, current_bw: 1000, vel_kp: 0.0125, vel_ki: 0.004, pos_kp: 150, pos_ki: 0.5 } }
    - { joint: 2, name: joint2, motor_id: 0x02, feedback_id: 0x12, model: dm4340, limit: { min: -3.7, max: 0.0 }, gains: { ctrl_mode: 2, current_bw: 1000, vel_kp: 0.013, vel_ki: 0.004, pos_kp: 200, pos_ki: 10 } }
    - { joint: 3, name: joint3, motor_id: 0x03, feedback_id: 0x13, model: dm4340, limit: { min: -3.7, max: 0.0 }, gains: { ctrl_mode: 2, current_bw: 1000, vel_kp: 0.013, vel_ki: 0.004, pos_kp: 200, pos_ki: 10 } }
    - { joint: 4, name: joint4, motor_id: 0x04, feedback_id: 0x14, model: dm4310, limit: { min: -1.57, max: 1.57 }, gains: { ctrl_mode: 2, current_bw: 1000, vel_kp: 0.0008, vel_ki: 0.002, pos_kp: 50, pos_ki: 1 } }
    - { joint: 5, name: joint5, motor_id: 0x05, feedback_id: 0x15, model: dm4310, limit: { min: -1.57, max: 1.57 }, gains: { ctrl_mode: 2, current_bw: 1000, vel_kp: 0.0008, vel_ki: 0.002, pos_kp: 50, pos_ki: 1 } }
    - { joint: 6, name: joint6, motor_id: 0x06, feedback_id: 0x16, model: dm4310, limit: { min: -1.57, max: 1.57 }, gains: { ctrl_mode: 2, current_bw: 1000, vel_kp: 0.0008, vel_ki: 0.002, pos_kp: 50, pos_ki: 1 } }
    - { joint: 7, name: gripper, motor_id: 0x07, feedback_id: 0x17, model: dm4310, limit: { min: -5.7, max: 0.0 }, gains: { ctrl_mode: 2, current_bw: 1000, vel_kp: 0.0008, vel_ki: 0.002, pos_kp: 50, pos_ki: 1 } }
  safety:
    zero_safe_eps_rad: 0.08 # refuse "zero all" unless every joint is near previous zero
    max_step_rad: 0.2 # per-command position step clamp
    max_step_rad_gripper: 0.12
    gripper_mit_clamp: { kp_max: 8, kd_max: 0.25, tau_max: 0.8 }
  urdf:
    package: reBot_B601_DM_with_gripper
    path: apps/studio/public/resources/arm02/reBot_B601_DM_with_gripper/urdf/reBot_B601_DM_with_gripper.urdf
    end_effector_link: null # set when adapter URDF lands

hand:
  name: leap_hand
  vendor: dynamixel
  protocol: 2.0
  transport: u2d2 # /dev/tty.usbserial-*
  # Confirmed by clankers-detect broadcast ping 2026-08-24: all 16 servos answer here.
  # lerobot's DynamixelMotorsBus defaults to 1M, so the gateway MUST set this before
  # its handshake or the connect ping finds nothing.
  baud: 1000000
  revision: unconfirmed # V1 vs V2 — decides current-limit policy below
  # CONFIRMED ON HARDWARE 2026-08-29 by jogging each group from the studio and watching
  # which finger actually moved:
  #     servos 0-3 = index, 4-7 = middle, 8-11 = ring, 12-15 = thumb.
  # The labels here used to be wrong for everything except the index: 4-7 were called
  # "thumb", 8-11 "middle" and 12-15 "ring", on the belief that URDF link names were
  # misleading. They were not — the LEAP URDF's 12-15 chain is literally
  # pip_4 -> thumb_pip -> thumb_dip -> thumb_fingertip, and the hardware agrees.
  # Limits and canonical indices were never in doubt (they match the LEAP URDF exactly);
  # only the human-facing names moved.
  # Still not swept independently: the direction sign of each individual joint. Motion
  # looked correct during the check, and per-command travel is bounded by
  # safety.max_step_rad, but a single reversed joint would not have been obvious.
  calibrated: true
  # Confirmed by clankers-detect broadcast ping 2026-08-24: all 16 servos report
  # xl330-m288 (natively in lerobot's table — the xc330-m288 local patch is now unused
  # but harmless). XL330 = plastic gears: keep the conservative current limit.
  motor_model: xl330-m288
  current_limit_ma: 300 # keep 300 for plastic-gear XL330s until bring-up proves headroom is needed
  temperature_limit_c: 70 # XC330 default shutdown threshold; do not raise
  poll:
    state_hz: 1 # pos/vel/current sync read (≤500 Hz possible; USB degrades above)
    health_hz: 1 # temp/voltage
  joints:
    # canonical = index in dexmanip canonical_pose / sim obs-action vectors, and equals
    # servo_id. Finger labels are anatomical and hardware-confirmed (see note above).
    - { canonical: 0, servo_id: 0, name: index_mcp_side, finger: index, limit: { min: -1.047, max: 1.047 } }
    - { canonical: 1, servo_id: 1, name: index_mcp_flex, finger: index, limit: { min: -0.314, max: 2.230 } }
    - { canonical: 2, servo_id: 2, name: index_pip, finger: index, limit: { min: -0.506, max: 1.885 } }
    - { canonical: 3, servo_id: 3, name: index_dip, finger: index, limit: { min: -0.366, max: 2.042 } }
    - { canonical: 4, servo_id: 4, name: middle_mcp_side, finger: middle, limit: { min: -1.047, max: 1.047 } }
    - { canonical: 5, servo_id: 5, name: middle_mcp_flex, finger: middle, limit: { min: -0.314, max: 2.230 } }
    - { canonical: 6, servo_id: 6, name: middle_pip, finger: middle, limit: { min: -0.506, max: 1.885 } }
    - { canonical: 7, servo_id: 7, name: middle_dip, finger: middle, limit: { min: -0.366, max: 2.042 } }
    - { canonical: 8, servo_id: 8, name: ring_mcp_side, finger: ring, limit: { min: -1.047, max: 1.047 } }
    - { canonical: 9, servo_id: 9, name: ring_mcp_flex, finger: ring, limit: { min: -0.314, max: 2.230 } }
    - { canonical: 10, servo_id: 10, name: ring_pip, finger: ring, limit: { min: -0.506, max: 1.885 } }
    - { canonical: 11, servo_id: 11, name: ring_dip, finger: ring, limit: { min: -0.366, max: 2.042 } }
    - { canonical: 12, servo_id: 12, name: thumb_base_rot, finger: thumb, limit: { min: -0.349, max: 2.094 } }
    - { canonical: 13, servo_id: 13, name: thumb_mcp_flex, finger: thumb, limit: { min: -0.470, max: 2.443 } }
    - { canonical: 14, servo_id: 14, name: thumb_pip, finger: thumb, limit: { min: -1.200, max: 1.900 } }
    - { canonical: 15, servo_id: 15, name: thumb_dip, finger: thumb, limit: { min: -1.340, max: 1.880 } }
  # Firmware motion profile (RAM registers 108/112 — not EEPROM, no wear concern).
  # Profile_Velocity = 0 (the factory default) means "no profile": the servo drives at full
  # speed toward each Goal_Position, which reads as a jerky step per command. Setting these
  # makes the servo ramp on a trapezoidal profile in firmware, the same way the Damiao arm
  # smooths a `pos_vel` command onboard. Applied on every connect.
  profile:
    # Units are rev/min AT THE OUTPUT SHAFT, so the joint speed is
    #   rad/s = rev_per_min / 60 * 2*pi
    # 6 rev/min ~= 0.63 rad/s ~= 36 deg/s: visibly controlled for a finger. This was 30
    # (~3.1 rad/s, ~180 deg/s) with a comment claiming 0.2 rad/s -- wrong by ~15x, and fast
    # enough that fingers reach a collision before anyone can react.
    velocity_rev_per_min: 6
    acceleration_rev_per_min2: 4000 # ramp rate into/out of that speed; 0 = instant
  safety:
    max_step_rad: 0.15 # per-command position step clamp (see step_clamp_pos below)
    # With a firmware profile the servo bounds its own speed, so chopping a `pos` command
    # into 0.15 rad pieces only means an operator must press "go to zero" four times to
    # actually get there. Jog keeps the clamp — it is a nudge primitive, not a pose command.
    step_clamp_pos: false
    heartbeat_interval_s: 0.5 # commanding clients must send heartbeat at this rate
    watchdog_multiplier: 4 # torque off after 4 missed heartbeat intervals (3-5x convention)

# --- adapter -------------------------------------------------------------------------
# Custom plate joining the arm tool flange to the LEAP hand (adapter_v5.stl, authored in
# millimetres -- hence mesh_scale). Geometry read off the STL 2026-08-29:
#   arm side  (z=0 face):  4 x O7.05 through-holes on a 35x35 square (O49.5 bolt circle)
#                          + O14 central bore, all centred on the STL origin -> the STL
#                          origin IS the flange axis, and z=0 is the mating face.
#   hand side (z=26 face): 6 x O6.2 on a O27 bolt circle, also centred on the origin, so
#                          the hand mounts coaxial with the wrist.
# link6's own mesh runs z=[-0.5, 9.0] mm in its frame, so its flange face is at z=+9 mm.
adapter:
  mesh: adapter_v5.stl
  mesh_scale: 0.001 # STL is in mm, URDF is in m
  link_name: adapter_link
  hand_link_prefix: hand_
  hand_root_link: palm_lower
  # PROVISIONAL, like the hand joint map: the flange side is measured, but the hand side
  # assumes the palm's largest flat face (z=+11.28 mm in the palm_lower link frame, normal
  # +Z) is its mounting face, centred on the wrist axis, with yaw clocking picked as 0.
  # The 6-hole ring allows 60 deg increments -- adjust hand_mount.rpy[2] if the real build
  # is clocked differently. Nothing downstream hard-codes these numbers; they live here.
  calibrated: false
  # The gripper and the adapter both bolt to the link6 flange, so they cannot coexist on
  # the real robot. This drives the generated URDF; `arm.lerobot.use_gripper` is a separate
  # decision about how many motors the arm gateway expects.
  keep_gripper: false
  arm_mount:
    parent: link6
    xyz: [0.0, 0.0, 0.009] # link6 flange face
    rpy: [0.0, 0.0, 0.0]
  hand_mount:
    # rpy roll=pi turns the palm over so its mount face lies on the adapter's z=26 face and
    # the fingers point away from the wrist; xyz then lands that face centre on the axis.
    xyz: [0.0601, -0.03724, 0.03728]
    rpy: [3.141592654, 0.0, 0.0]

control:
  # Sim-derived starting points (dexmanip LeapHandRot) — validate on hardware before trusting.
  policy_hz: 20
  sim_action_scale: 0.041666667 # 1/24 rad per policy step (delta actions)

viz:
  rerun_sdk_pin: "0.30" # .rrd not stable across minors; keep SDK+viewer+npm web-viewer aligned
  memory_limit: "25%"
  rrd_cache_max_gb: 20 # data/rrd GC threshold; failures retained longest
