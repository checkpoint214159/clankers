[project]
name = "clankers-workspace"
version = "0.1.0"
description = "Operations stack for the reBot B601-DM arm + LEAP hand"
requires-python = ">=3.12"
dependencies = ["clankers", "lerobot-robot-clankers"]

[project.optional-dependencies]
hardware = ["clankers[hardware]", "lerobot-robot-clankers[hardware]"]
viz = ["clankers[viz]"]

[tool.uv.workspace]
members = ["packages/clankers", "packages/lerobot_robot_clankers"]

[tool.uv.sources]
clankers = { workspace = true }
lerobot-robot-clankers = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
